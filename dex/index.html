    <script>
      // the dex can live in any folder (GitHub Pages): links and routes hang off DEXROOT
      var DEXROOT = (function () {
        var p = location.pathname, i = p.indexOf('/dex/');
        return i >= 0 ? p.slice(0, i + 5) : '/';
      })();
      document.write('<base href="' + DEXROOT + '">');
      (function () {  // deep links arrive through 404.html as ?p=<path>
        var m = location.search.match(/[?&]p=([^&]*)/);
        if (m) history.replaceState(null, '', DEXROOT + decodeURIComponent(m[1]));
      })();
    </script>
